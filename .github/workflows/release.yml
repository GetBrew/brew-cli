name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

# Let the active release finish before a duplicate tag run starts.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # npm rejects provenance from self-hosted runners, including Blacksmith.
    # Keep publishing independent of CI_RUNNER_SMALL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          TAG_V=${GITHUB_REF_NAME#v}
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "package.json version $PKG_V does not match tag $TAG_V"
            exit 1
          fi
      - run: bun run tsc
      - run: bun run lint
      - run: bun run test
      - run: bun run docs:commands:check
      - run: bun run generate:skills:check
      # The launchers ship the CLI's own version, pinned exactly.
      - run: bun run sync:launchers:check
      - run: bun run build
      - name: Launcher pack smoke
        run: bun run smoke:launchers
      - name: Compile standalone binaries
        run: bun run scripts/build-binaries.ts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: |
            dist-bin/*
          generate_release_notes: true
      - name: Publish to npm with provenance
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish." \
              "Add it and re-run this workflow to publish."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # `npx brew.new` and `npm create brew`: thin launchers pinned to this
      # CLI version, published after it. A version npm already has is
      # skipped, so re-running the workflow is safe.
      - name: Publish launchers (brew.new, create-brew)
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping launcher publish."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          bun run scripts/smoke-launchers.ts --registry
          for pkg in brew.new create-brew; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION is already on npm — skipping."
              continue
            fi
            (cd "packages/launchers/$pkg" && npm publish --provenance --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Bump Homebrew tap
        run: bun run scripts/update-tap.ts
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
