name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Let the active release finish before a duplicate tag run starts.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          TAG_V=${GITHUB_REF_NAME#v}
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "package.json version $PKG_V does not match tag $TAG_V"
            exit 1
          fi
      - run: bun run tsc
      - run: bun run lint
      - run: bun run test
      - run: bun run docs:commands:check
      - run: bun run build
      - name: Bin smoke
        run: |
          node dist/bin.js --version
          node dist/bin.js --help > /dev/null
          node dist/bin.js docs --agent > /dev/null
      - name: Signal smoke
        run: bun run smoke:signals
      - name: CLI regression smoke
        run: bun run smoke:regressions
      - name: Compile standalone binaries
        run: bun run scripts/build-binaries.ts
      - name: Pack the release
        id: pack
        run: |
          dest="$RUNNER_TEMP/release-artifact"
          mkdir -p "$dest"
          package="$(npm pack --ignore-scripts --pack-destination "$dest")"
          mv "$dest/$package" "$dest/package.tgz"
          mv dist-bin "$dest/"
          printf 'artifact=release-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Save the validated package and binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    # npm provenance requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 15
    env:
      PACKAGE_NAME: '@brew.new/cli'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-artifact/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify the packed release identity
        shell: bash
        run: |
          tar -xOzf "$RUNNER_TEMP/release-artifact/package.tgz" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (pkg.name !== process.env.PACKAGE_NAME || `v${pkg.version}` !== process.env.GITHUB_REF_NAME) {
              throw new Error("Packed CLI name or version does not match the release tag.");
            }
            if (JSON.stringify(pkg.publishConfig) !== "{\"access\":\"public\"}") {
              throw new Error("Unexpected npm publish configuration in the packed CLI.");
            }
          '
      - name: Create GitHub Release
        id: github-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/release-artifact/dist-bin/*
          generate_release_notes: true
      - name: Verify GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github-release.outputs.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" |
            jq -s add > "$RUNNER_TEMP/release-assets.json"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream, readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { RUNNER_TEMP } = process.env;
          const released = JSON.parse(readFileSync(join(RUNNER_TEMP, 'release-assets.json'), 'utf8'));
          const assets = new Map(released.map(({ name, digest }) => [name, digest]));
          const directory = join(RUNNER_TEMP, 'release-artifact/dist-bin');
          const names = readdirSync(directory);
          if (!names.includes('checksums.txt') || names.length < 2) {
            throw new Error('The release artifact lacks binaries or checksums.');
          }
          for (const name of names) {
            const hash = createHash('sha256');
            for await (const chunk of createReadStream(join(directory, name))) hash.update(chunk);
            if (assets.get(name) !== `sha256:${hash.digest('hex')}`) {
              throw new Error(`GitHub Release asset differs from the validated build: ${name}`);
            }
          }
          NODE
      - name: Publish to npm with provenance
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish." \
              "Add it and re-run this workflow to publish."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const { PACKAGE_NAME, GITHUB_REF_NAME, RUNNER_TEMP } = process.env;
          const archive = `${RUNNER_TEMP}/release-artifact/package.tgz`;
          const registry = 'https://registry.npmjs.org';
          const version = GITHUB_REF_NAME.slice(1);
          const metadataUrl = `${registry}/${encodeURIComponent(PACKAGE_NAME)}/${encodeURIComponent(version)}`;
          const integrity = `sha512-${createHash('sha512').update(readFileSync(archive)).digest('base64')}`;

          async function alreadyPublished() {
            const response = await fetch(metadataUrl, {
              headers: { 'cache-control': 'no-cache' },
              redirect: 'error',
              signal: AbortSignal.timeout(20_000),
            });
            if (response.status === 404) return false;
            if (!response.ok) throw new Error(`npm version lookup failed (${response.status}).`);
            const published = await response.json();
            if (published.name !== PACKAGE_NAME || published.version !== version ||
                published.dist?.integrity !== integrity) {
              throw new Error('The registry has a different archive for this version.');
            }
            console.log('The exact release archive is already on npm.');
            return true;
          }

          if (!(await alreadyPublished())) {
            const result = spawnSync('npm', [
              'publish', archive, `--registry=${registry}`, '--ignore-scripts',
              '--provenance', '--access', 'public',
            ], { stdio: 'inherit' });
            if (result.status !== 0 && !(await alreadyPublished())) {
              process.exitCode = result.status ?? 1;
            }
          }
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Check out the tap updater from the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/update-tap.ts
          sparse-checkout-cone-mode: false
      - name: Bump Homebrew tap
        run: |
          mkdir -p dist-bin
          cp "$RUNNER_TEMP/release-artifact/dist-bin/checksums.txt" dist-bin/
          node --experimental-strip-types scripts/update-tap.ts
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
