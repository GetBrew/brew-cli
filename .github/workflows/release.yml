name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # npm rejects provenance from self-hosted runners, including Blacksmith.
    # Keep publishing independent of CI_RUNNER_SMALL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          TAG_V=${GITHUB_REF_NAME#v}
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "package.json version $PKG_V does not match tag $TAG_V"
            exit 1
          fi
      - run: bun run tsc
      - run: bun run lint
      - run: bun run test
      - run: bun run docs:commands:check
      - run: bun run generate:skills:check
      - run: bun run build
      - name: Compile standalone binaries
        run: bun run scripts/build-binaries.ts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/*
          generate_release_notes: true
      - name: Publish to npm with provenance
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish." \
              "Add it and re-run this workflow to publish."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # `brew.new` and `create-brew`: thin launchers pinned to this CLI
      # version, published after it. This step never fails the release (the
      # CLI is already out): a version npm already has is skipped, and a
      # failed check or publish, such as a name the token does not own yet,
      # leaves a warning.
      - name: Publish launchers (brew.new, create-brew)
        continue-on-error: true
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN not set; launchers not published."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          if ! bun run sync:launchers:check || ! bun run smoke:launchers \
            || ! bun run scripts/smoke-launchers.ts --registry; then
            echo "::warning::Launcher checks failed; brew.new and create-brew $VERSION not published. The CLI release is unaffected."
            exit 0
          fi
          for pkg in brew.new create-brew; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION is already on npm; skipping."
              continue
            fi
            if ! (cd "packages/launchers/$pkg" && npm publish --provenance --access public); then
              echo "::warning::$pkg@$VERSION was not published (is the npm name reserved for this token?). The CLI release is unaffected."
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Bump Homebrew tap
        run: bun run scripts/update-tap.ts
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
